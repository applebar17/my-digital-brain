<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI configuration inspector</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #111418; color: #e8edf3; }
    body { margin: 0; padding: 28px; max-width: 1380px; margin-inline: auto; }
    h1, h2, h3, h4 { line-height: 1.2; }
    p, small { color: #aeb9c6; }
    .layout { display: grid; grid-template-columns: minmax(340px, 480px) minmax(0, 1fr); gap: 24px; }
    .panel { border: 1px solid #39434e; border-radius: 12px; padding: 18px; background: #1b2027; }
    .group { margin-bottom: 24px; }
    .group-title { margin-bottom: 4px; }
    .card { width: 100%; color: inherit; text-align: left; cursor: pointer; margin: 10px 0; padding: 14px; font: inherit; border: 1px solid #39434e; border-radius: 10px; background: #1b2027; }
    .card:hover, .card[aria-selected="true"] { border-color: #88abff; }
    .card.agentic { border-left: 4px solid #a5d6a7; }
    .card.deterministic { border-left: 4px solid #88abff; }
    .card strong { display: block; margin-bottom: 7px; }
    .summary { display: grid; grid-template-columns: 92px 1fr; gap: 2px 8px; font-size: 12px; }
    .summary dt { color: #8290a0; }
    .summary dd { margin: 0; overflow-wrap: anywhere; }
    .edge { color: #9ba7b5; margin: 0 0 0 16px; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #303b49; font-size: 12px; }
    .section { border-top: 1px solid #39434e; margin-top: 18px; padding-top: 12px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #111418; padding: 12px; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #39434e; padding: 7px; text-align: left; vertical-align: top; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>AI configuration inspector</h1>
  <p>Local, read-only view assembled from the current state, toolbox, prompt, and workflow code. No provider or storage call is made.</p>
  <div class="layout"><nav id="composition" aria-label="AI configuration"></nav><main id="details" class="panel"></main></div>
  <script>
    const element = (tag, text, parent, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      if (parent) parent.appendChild(node);
      return node;
    };
    const details = document.getElementById('details');
    const composition = document.getElementById('composition');

    function model(title, contract, parent) {
      if (!contract) return;
      element('h3', `${title} - ${contract.name}`, parent);
      const table = element('table', undefined, parent);
      const head = element('tr', undefined, table);
      for (const label of ['Field', 'Type', 'Description']) element('th', label, head);
      for (const field of contract.fields) {
        const row = element('tr', undefined, table);
        element('td', field.name + (field.required ? ' *' : ''), row);
        element('td', field.type_name, row);
        element('td', field.description || '-', row);
      }
    }

    function stage(title, config, parent) {
      if (!config) return;
      const area = element('section', undefined, parent, 'section');
      element('h3', title, area);
      element('p', `Parallel tool calls: ${config.parallel_tool_calls ?? 'not specified'}`, area);
      element('h4', 'System prompt', area);
      element('pre', config.system_prompt, area);
      model('Structured output', config.response_model, area);
      element('h4', `Toolbox: ${config.toolbox_name || 'none'}`, area);
      if (!config.tools.length) element('p', 'No tools configured.', area);
      for (const tool of config.tools) toolDetails(tool, area);
    }

    function toolDetails(tool, parent) {
      const area = element('div', undefined, parent, 'section');
      element('strong', tool.name, area);
      element('p', tool.description, area);
      model('Tool input', tool.input_model, area);
      model('Tool output', tool.output_model, area);
      if (tool.child_state) {
        element('h4', `Child AI state: ${tool.child_state.state_id}`, area);
        element('p', `Child toolbox: ${tool.child_state.toolbox_name || 'none'}`, area);
        for (const childTool of tool.child_state.tools) toolDetails(childTool, area);
      }
    }

    function toolNames(agentic) {
      if (!agentic || !agentic.main.tools.length) return 'none';
      return agentic.main.tools.map(tool => tool.name).join(', ');
    }

    function summaryRows(item) {
      const agentic = item.agentic;
      return [
        ['Input', item.input_model.name],
        ['Output', item.output_model?.name || 'assistant message'],
        ['Tools', toolNames(agentic)],
        ['Reasoning stage', agentic ? (agentic.reasoning ? 'configured' : 'not configured') : 'n/a'],
        ['Planning stage', agentic ? (agentic.planning ? 'configured' : 'not configured') : 'n/a'],
      ];
    }

    function addCard(item, kind, parent, selectItem) {
      const button = element('button', undefined, parent, `card ${kind}`);
      button.type = 'button';
      element('strong', item.title, button);
      const summary = element('dl', undefined, button, 'summary');
      for (const [label, value] of summaryRows(item)) {
        element('dt', label, summary);
        element('dd', value, summary);
      }
      button.addEventListener('click', () => selectItem(item, button));
      return button;
    }

    function markSelected(button) {
      for (const candidate of composition.querySelectorAll('button')) {
        candidate.setAttribute('aria-selected', String(candidate === button));
      }
    }

    function showAgentic(item, button, badge) {
      markSelected(button);
      details.replaceChildren();
      element('span', badge, details, 'badge');
      element('h2', item.title, details);
      element('p', item.description, details);
      model('Input DTO', item.input_model, details);
      if (item.output_model) model('Output DTO', item.output_model, details);
      else element('p', 'Output: assistant message in the agentic runtime result envelope.', details);
      element('p', `State: ${item.agentic.state_id}`, details);
      element('p', `Invocation request: ${item.agentic.invocation_request}`, details);
      stage('Main call', item.agentic.main, details);
      if (item.agentic.reasoning) stage('Reasoning call', item.agentic.reasoning, details);
      else element('p', 'Reasoning call: not configured', details);
      if (item.agentic.planning) stage('Planning call', item.agentic.planning, details);
      else element('p', 'Planning call: not configured', details);
    }

    function showStep(step, button) {
      markSelected(button);
      details.replaceChildren();
      element('span', step.kind === 'agentic' ? 'AI workflow step' : 'Deterministic step', details, 'badge');
      element('h2', step.title, details);
      element('p', step.description, details);
      element('p', `Depends on: ${step.depends_on.join(', ') || 'workflow input'}`, details);
      model('Input DTO', step.input_model, details);
      model('Output DTO', step.output_model, details);
      if (step.agentic) {
        element('p', `State: ${step.agentic.state_id}`, details);
        element('p', `Invocation request: ${step.agentic.invocation_request}`, details);
        stage('Main call', step.agentic.main, details);
        if (step.agentic.reasoning) stage('Reasoning call', step.agentic.reasoning, details);
        else element('p', 'Reasoning call: not configured', details);
        if (step.agentic.planning) stage('Planning call', step.agentic.planning, details);
        else element('p', 'Planning call: not configured', details);
      }
    }

    fetch('/api/configuration').then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }).then(configuration => {
      const stateGroup = element('section', undefined, composition, 'group');
      element('h2', 'Configured AI states', stateGroup, 'group-title');
      element('small', 'Standalone and entry states assembled by the application.', stateGroup);
      let firstButton = null;
      let firstItem = null;
      for (const state of configuration.states) {
        const button = addCard(state, 'agentic', stateGroup, (item, selected) => showAgentic(item, selected, 'AI state'));
        if (!firstButton) { firstButton = button; firstItem = state; }
      }

      for (const workflow of configuration.workflows) {
        const group = element('section', undefined, composition, 'group');
        element('h2', workflow.workflow_id, group, 'group-title');
        element('small', workflow.description, group);
        for (const step of workflow.steps) {
          if (step.depends_on.length) element('div', `from ${step.depends_on.join(', ')}`, group, 'edge');
          const button = addCard(step, step.kind, group, showStep);
          if (!firstButton) { firstButton = button; firstItem = step; }
        }
      }
      if (firstButton && firstItem) showAgentic(firstItem, firstButton, 'AI state');
    }).catch(error => { details.textContent = `Cannot load configuration: ${error.message}`; });
  </script>
</body>
</html>
