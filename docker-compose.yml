services:
  backend:
    build: .
    env_file:
      - src/my_digital_brain/.env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_started
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - brain

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - brain

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - brain

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-brain} -d $${POSTGRES_DB:-brain}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brain

  chroma:
    image: chromadb/chroma:0.5.23
    environment:
      ANONYMIZED_TELEMETRY: ${ANONYMIZED_TELEMETRY:-False}
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - brain

networks:
  brain:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  chroma_data:
