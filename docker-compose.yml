services:
  backend:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      RELATIONAL_BACKEND: ${RELATIONAL_BACKEND:-postgres}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+psycopg://brain:brain@postgres:5432/brain}
      SQLITE_PATH: ${SQLITE_PATH:-data/local/brain.sqlite3}
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_COLLECTION_PREFIX: ${CHROMA_COLLECTION_PREFIX:-my_digital_brain}
      SOURCE_MEDIA_ROOT: ${SOURCE_MEDIA_ROOT:-data/source-media}
      FRONTEND_CORS_ORIGINS: ${FRONTEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      WEB_CHAT_AUTH_TOKEN: ${WEB_CHAT_AUTH_TOKEN:-change-me-web-chat-token}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_started
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - brain

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WEB_CHAT_AUTH_TOKEN: ${WEB_CHAT_AUTH_TOKEN:-change-me-web-chat-token}
        VITE_OWNER_ID: ${FRONTEND_VITE_OWNER_ID:-owner-local}
        VITE_SENDER_ID: ${FRONTEND_VITE_SENDER_ID:-owner-local}
        VITE_CONVERSATION_ID: ${FRONTEND_VITE_CONVERSATION_ID:-web-local}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - brain

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - brain

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-brain} -d $${POSTGRES_DB:-brain}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brain

  chroma:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - brain

networks:
  brain:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  chroma_data:
